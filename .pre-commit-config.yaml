# Pre-commit hooks configuration for cc_plugins (merged)
# Usage: pip install pre-commit && pre-commit install

default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false
default_language_version:
  python: python3

repos:
  # === Plugin Validation (from Skills_demo) ===
  - repo: local
    hooks:
      # 验证 marketplace.json
      - id: validate-marketplace
        name: Validate marketplace.json
        entry: bash -c 'if ! command -v claude &> /dev/null; then echo "❌ Claude CLI 未安装" && exit 1; fi; if ! claude plugin validate .claude-plugin/marketplace.json; then echo "❌ marketplace.json 验证失败" && exit 1; fi; echo "✅ marketplace.json 验证通过"'
        language: system
        files: 'marketplace\.json$'
        pass_filenames: false

      # 验证各个插件的 plugin.json 格式
      - id: validate-plugin-json
        name: Validate plugin.json format
        entry: >-
          bash -c '
          file="$1";
          echo "验证 $file";

          author_type=$(jq -r ".author | type" "$file" 2>/dev/null || echo "null");
          if [ "$author_type" != "object" ]; then
            echo "❌ author 必须是对象类型 {\"name\": \"...\", \"email\": \"...\"}";
            exit 1;
          fi;

          author_name=$(jq -r ".author.name" "$file" 2>/dev/null || echo "");
          if [ "$author_name" = "" ] || [ "$author_name" = "null" ]; then
            echo "❌ author.name 不能为空";
            exit 1;
          fi;

          if jq -e ".category" "$file" >/dev/null 2>&1; then
            echo "❌ 不应有 category 字段";
            exit 1;
          fi;

          if jq -e ".entry_points" "$file" >/dev/null 2>&1; then
            echo "❌ 不应有 entry_points 字段，应直接使用 agents/skills/commands";
            exit 1;
          fi;

          echo "✅ $file 格式正确";
          ' bash
        language: system
        files: '^plugins/[^/]*/\.claude-plugin/plugin\.json$'

  # === General Code Quality (from cc_plugins) ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ["--maxkb=1500"]
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        stages: [pre-commit]

  # === Python Linting (from cc_plugins) ===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: \.py$
        stages: [pre-commit]
      - id: ruff-format
        files: \.py$
        stages: [pre-commit]

  # === GitHub Actions (from cc_plugins) ===
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        args: ["-shellcheck="]
        files: ^\.github/workflows/.*\.(yml|yaml)$
        stages: [pre-commit]

  # === TypeScript Checks (from Skills_demo) ===
  - repo: local
    hooks:
      - id: ts-type-check
        name: TypeScript 类型检查
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: build-on-push
        name: Push 前构建校验
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

exclude: |
  (?x)^(
    node_modules/.*|
    dist/.*|
    assets/videos/.*|
    PROFILE
  )$
