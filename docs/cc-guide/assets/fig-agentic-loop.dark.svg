<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470"
     width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">agentic loop 三段循环与提示词收敛对比</title>
  <desc id="d">左侧是一个三段循环：收集上下文、采取行动、验证结果，箭头沿圆周循环，底部一条橙色箭头标出「未完成则回到第一步」。右侧对比模糊提示需要三到五轮收敛，精确提示只需一到两轮。</desc>
  <style>
  :root {

    --ink:#e2e8f0; --muted:#94a3b8; --line:#475569;
    --panel:#1e293b; --panel2:#172033;
    --accent:#a5b4fc; --accent-bg:#312e81; --accent-line:#4f46e5;
    --danger:#fca5a5; --danger-bg:#4c1d1d; --danger-line:#7f1d1d;
    --warn:#fcd34d; --warn-bg:#451a03; --warn-line:#78350f;
    --ok:#6ee7b7; --ok-bg:#064e3b; --ok-line:#065f46;
    --shadow:rgba(0,0,0,.35);

  }
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    fill: var(--ink);
  }
  /* 字号是按「图在正文列里显示后的实际大小」定的：
     正文列约 740px，图的设计宽度是 960 → 缩放约 0.77。
     所以这里的 15px 在页面上大约是 11.6px，不能再小了。 */
  .t-title  { font-size:22px; font-weight:700; }
  .t-sub    { font-size:15.5px; fill:var(--muted); }
  .t-h      { font-size:17px; font-weight:650; }
  .t-body   { font-size:15px; }
  .t-small  { font-size:13px; fill:var(--muted); }
  .t-mono   { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; font-size:13.5px; }
  .t-badge  { font-size:12.5px; font-weight:700; letter-spacing:.4px; }
  .panel    { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
  .panel-a  { fill:var(--accent-bg); stroke:var(--accent-line); stroke-width:1.2; }
  .panel-d  { fill:var(--danger-bg); stroke:var(--danger-line); stroke-width:1.2; }
  .panel-w  { fill:var(--warn-bg);   stroke:var(--warn-line);   stroke-width:1.2; }
  .panel-o  { fill:var(--ok-bg);     stroke:var(--ok-line);     stroke-width:1.2; }
  .edge     { stroke:var(--line); stroke-width:1.6; fill:none; }
  .edge-a   { stroke:var(--accent); stroke-width:2; fill:none; }
  .edge-d   { stroke:var(--danger); stroke-width:2; fill:none; }
  .edge-w   { stroke:var(--warn);   stroke-width:2; fill:none; }
  .ink-a    { fill:var(--accent); }
  .ink-d    { fill:var(--danger); }
  .ink-w    { fill:var(--warn); }
  .ink-o    { fill:var(--ok); }
  .ink-m    { fill:var(--muted); }

  /* —— 动画 —— */
  @keyframes dash  { to { stroke-dashoffset:-40; } }
  @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @keyframes rise  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes sweep { from { transform:translateX(-40px); } to { transform:translateX(40px); } }

  .flow    { stroke-dasharray:7 13; animation:dash 1.6s linear infinite; }
  .pulse   { animation:pulse 2.2s ease-in-out infinite; }
  .rise    { animation:rise .5s ease-out both; }
  .rise-2  { animation:rise .5s .12s ease-out both; }
  .rise-3  { animation:rise .5s .24s ease-out both; }
  .rise-4  { animation:rise .5s .36s ease-out both; }
  .sweep   { animation:sweep 2.6s ease-in-out infinite alternate; }

  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.rise,.rise-2,.rise-3,.rise-4,.sweep { animation:none; }
  }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)"/>
    </filter>
  </defs>
  <rect width="960" height="470" fill="var(--panel)"/>
  <rect width="960" height="470" fill="none"/>
  <text x="480.0" y="34" class="t-title" text-anchor="middle">agentic loop：提示词的作用是让循环更快收敛</text>
  <path d="M359.2,111.5 A158,158 0 0 1 456.5,280.0" class="edge" stroke-width="2" opacity="0.55"/>
  <path d="M359.2,111.5 A158,158 0 0 1 456.5,280.0" class="edge-a flow" stroke-width="3" marker-end="url(#ah-a)"/>
  <path d="M397.3,382.5 A158,158 0 0 1 202.7,382.5" class="edge" stroke-width="2" opacity="0.55"/>
  <path d="M397.3,382.5 A158,158 0 0 1 202.7,382.5" class="edge-a flow" stroke-width="3" marker-end="url(#ah-a)"/>
  <path d="M143.5,280.0 A158,158 0 0 1 240.8,111.5" class="edge" stroke-width="2" opacity="0.55"/>
  <path d="M143.5,280.0 A158,158 0 0 1 240.8,111.5" class="edge-a flow" stroke-width="3" marker-end="url(#ah-a)"/>
  <path d="M143.5,280.0 A158,158 0 0 1 240.8,111.5" class="edge" stroke-width="2" opacity="0.55"/>
  <path d="M143.5,280.0 A158,158 0 0 1 240.8,111.5" class="edge-w flow" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="204.0" y="110.0" width="192" height="64" rx="12" class="panel-a" filter="url(#sh)"/>
  <text x="300.0" y="138.0" class="t-h" text-anchor="middle">收集上下文</text>
  <text x="300.0" y="159.0" class="t-small" text-anchor="middle">读文件 · 搜代码 · 查文档</text>
  <rect x="304.4589468389949" y="284.0" width="192" height="64" rx="12" class="panel-a" filter="url(#sh)"/>
  <text x="400.4589468389949" y="312.0" class="t-h" text-anchor="middle">采取行动</text>
  <text x="400.4589468389949" y="333.0" class="t-small" text-anchor="middle">编辑 · 运行 · 调用工具</text>
  <rect x="103.5410531610051" y="284.0" width="192" height="64" rx="12" class="panel-a" filter="url(#sh)"/>
  <text x="199.5410531610051" y="312.0" class="t-h" text-anchor="middle">验证结果</text>
  <text x="199.5410531610051" y="333.0" class="t-small" text-anchor="middle">跑测试 · 看报错 · 确认</text>
  <text x="300" y="228" class="t-h" text-anchor="middle">一个提示</text>
  <text x="300" y="250" class="t-small" text-anchor="middle">→ 一轮轮迭代</text>
  <text x="300" y="272" class="t-small ink-w" text-anchor="middle">未完成 → 回到第一步</text>
  <rect x="540" y="90" width="380" height="150" rx="12" class="panel-d"/>
  <text x="560" y="122" class="t-h ink-d">模糊的提示</text>
  <text x="560" y="148" class="t-mono" fill="var(--muted)">「帮我优化一下这个插件的加载速度」</text>
  <text x="560" y="180" class="t-body">3–5 轮才收敛 · 每轮都贵</text>
  <text x="560" y="206" class="t-small">Claude 猜「完成」是什么，顺手改了别的地方</text>
  <rect x="540" y="258" width="380" height="150" rx="12" class="panel-o"/>
  <text x="560" y="290" class="t-h ink-o">精确的提示</text>
  <text x="560" y="316" class="t-mono" fill="var(--muted)">目标 + 约束 + 验收标准</text>
  <text x="560" y="348" class="t-body">1–2 轮收敛</text>
  <text x="560" y="374" class="t-small">「完成」可判定，模型不需要猜</text>
  <text x="480.0" y="436" class="t-small" text-anchor="middle">官方 best-practices 的原话：Delegate, don't dictate —— 给出目标与验收标准，而不是逐步指令。</text>
</svg>
