<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620"
     width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">能力选型决策树</title>
  <desc id="d">从「需要绝对不能违反的规则」到「跨会话协同」，每类问题对应一个首选机制：permissions.deny、CLAUDE.md、rules+paths、Skill/Subagent、MCP、Hook、跨会话消息或 Workflow。</desc>
  <style>
  :root {

    --ink:#0f172a; --muted:#64748b; --line:#cbd5e1;
    --panel:#f8fafc; --panel2:#f1f5f9;
    --accent:#4f46e5; --accent-bg:#eef2ff; --accent-line:#c7d2fe;
    --danger:#dc2626; --danger-bg:#fef2f2; --danger-line:#fecaca;
    --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
    --ok:#047857; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
    --shadow:rgba(15,23,42,.06);

  }
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    fill: var(--ink);
  }
  /* 字号是按「图在正文列里显示后的实际大小」定的：
     正文列约 740px，图的设计宽度是 960 → 缩放约 0.77。
     所以这里的 15px 在页面上大约是 11.6px，不能再小了。 */
  .t-title  { font-size:22px; font-weight:700; }
  .t-sub    { font-size:15.5px; fill:var(--muted); }
  .t-h      { font-size:17px; font-weight:650; }
  .t-body   { font-size:15px; }
  .t-small  { font-size:13px; fill:var(--muted); }
  .t-mono   { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; font-size:13.5px; }
  .t-badge  { font-size:12.5px; font-weight:700; letter-spacing:.4px; }
  .panel    { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
  .panel-a  { fill:var(--accent-bg); stroke:var(--accent-line); stroke-width:1.2; }
  .panel-d  { fill:var(--danger-bg); stroke:var(--danger-line); stroke-width:1.2; }
  .panel-w  { fill:var(--warn-bg);   stroke:var(--warn-line);   stroke-width:1.2; }
  .panel-o  { fill:var(--ok-bg);     stroke:var(--ok-line);     stroke-width:1.2; }
  .edge     { stroke:var(--line); stroke-width:1.6; fill:none; }
  .edge-a   { stroke:var(--accent); stroke-width:2; fill:none; }
  .edge-d   { stroke:var(--danger); stroke-width:2; fill:none; }
  .edge-w   { stroke:var(--warn);   stroke-width:2; fill:none; }
  .ink-a    { fill:var(--accent); }
  .ink-d    { fill:var(--danger); }
  .ink-w    { fill:var(--warn); }
  .ink-o    { fill:var(--ok); }
  .ink-m    { fill:var(--muted); }

  /* —— 动画 —— */
  @keyframes dash  { to { stroke-dashoffset:-40; } }
  @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @keyframes rise  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes sweep { from { transform:translateX(-40px); } to { transform:translateX(40px); } }

  .flow    { stroke-dasharray:7 13; animation:dash 1.6s linear infinite; }
  .pulse   { animation:pulse 2.2s ease-in-out infinite; }
  .rise    { animation:rise .5s ease-out both; }
  .rise-2  { animation:rise .5s .12s ease-out both; }
  .rise-3  { animation:rise .5s .24s ease-out both; }
  .rise-4  { animation:rise .5s .36s ease-out both; }
  .sweep   { animation:sweep 2.6s ease-in-out infinite alternate; }

  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.rise,.rise-2,.rise-3,.rise-4,.sweep { animation:none; }
  }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)"/>
    </filter>
  </defs>
  <rect width="960" height="620" fill="var(--panel)"/>
  <rect width="960" height="620" fill="none"/>
  <text x="480.0" y="34" class="t-title" text-anchor="middle">能力选型：先问「这条约束需要多强」</text>
  <rect x="330" y="56" width="300" height="52" rx="12" class="panel-a" filter="url(#sh)"/>
  <text x="480" y="88" class="t-h" text-anchor="middle">需要解决什么问题？</text>
  <path d="M480,108 L480,140" class="edge-a" marker-end="url(#ah-a)"/>
  <rect x="60" y="140" width="300" height="46" rx="10" class="panel-d"/>
  <text x="76" y="168" class="t-body">绝对不能违反的规则</text>
  <path d="M360,163 L420,163" class="edge-d" marker-end="url(#ah)"/>
  <rect x="420" y="140" width="480" height="46" rx="10" class="panel"/>
  <text x="438" y="161" class="t-h ink-d">permissions.deny</text>
  <text x="438" y="178" class="t-small">+ 必要时 command 型 hook</text>
  <rect x="60" y="210" width="300" height="46" rx="10" class="panel-a"/>
  <text x="76" y="238" class="t-body">每次会话都要知道的事实</text>
  <path d="M360,233 L420,233" class="edge-a" marker-end="url(#ah)"/>
  <rect x="420" y="210" width="480" height="46" rx="10" class="panel"/>
  <text x="438" y="231" class="t-h ink-a">CLAUDE.md（&lt; 200 行）</text>
  <text x="438" y="248" class="t-small">启动即加载</text>
  <rect x="60" y="280" width="300" height="46" rx="10" class="panel-a"/>
  <text x="76" y="308" class="t-body">只在某类文件上成立</text>
  <path d="M360,303 L420,303" class="edge-a" marker-end="url(#ah)"/>
  <rect x="420" y="280" width="480" height="46" rx="10" class="panel"/>
  <text x="438" y="301" class="t-h ink-a">.claude/rules/ + paths:</text>
  <text x="438" y="318" class="t-small">按需加载</text>
  <rect x="60" y="350" width="300" height="46" rx="10" class="panel-w"/>
  <text x="76" y="378" class="t-body">可复用的多步流程</text>
  <path d="M360,373 L420,373" class="edge-w" marker-end="url(#ah)"/>
  <rect x="420" y="350" width="480" height="46" rx="10" class="panel"/>
  <text x="438" y="371" class="t-h ink-w">Skill 或 Subagent</text>
  <text x="438" y="388" class="t-small">要不要隔离上下文？</text>
  <rect x="60" y="420" width="300" height="46" rx="10" class="panel-a"/>
  <text x="76" y="448" class="t-body">外部系统的数据</text>
  <path d="M360,443 L420,443" class="edge-a" marker-end="url(#ah)"/>
  <rect x="420" y="420" width="480" height="46" rx="10" class="panel"/>
  <text x="438" y="441" class="t-h ink-a">MCP server</text>
  <text x="438" y="458" class="t-small">提供新工具</text>
  <rect x="60" y="490" width="300" height="46" rx="10" class="panel-o"/>
  <text x="76" y="518" class="t-body">确定性的动作编排</text>
  <path d="M360,513 L420,513" class="edge-a" marker-end="url(#ah)"/>
  <rect x="420" y="490" width="480" height="46" rx="10" class="panel"/>
  <text x="438" y="511" class="t-h ink-o">Hook（command 型）</text>
  <text x="438" y="528" class="t-small">代码执行</text>
  <rect x="60" y="560" width="300" height="46" rx="10" class="panel-w"/>
  <text x="76" y="588" class="t-body">跨会话 / 跨机器协同</text>
  <path d="M360,583 L420,583" class="edge-w" marker-end="url(#ah)"/>
  <rect x="420" y="560" width="480" height="46" rx="10" class="panel"/>
  <text x="438" y="581" class="t-h ink-w">跨会话消息 或 Workflow</text>
  <text x="438" y="598" class="t-small">规模决定</text>
</svg>
