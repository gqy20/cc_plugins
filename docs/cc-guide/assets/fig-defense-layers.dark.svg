<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500"
     width="960" height="500" role="img" aria-labelledby="t d">
  <title id="t">权限与护栏的三层防线</title>
  <desc id="d">三层嵌套：最外层是容器或虚拟机的外层隔离，中间是操作系统强制的沙箱，最内层是权限规则与权限模式。模型意图在最内层，只是建议。右侧展示一条命令在第二层被沙箱边界挡住。</desc>
  <style>
  :root {

    --ink:#e2e8f0; --muted:#94a3b8; --line:#475569;
    --panel:#1e293b; --panel2:#172033;
    --accent:#a5b4fc; --accent-bg:#312e81; --accent-line:#4f46e5;
    --danger:#fca5a5; --danger-bg:#4c1d1d; --danger-line:#7f1d1d;
    --warn:#fcd34d; --warn-bg:#451a03; --warn-line:#78350f;
    --ok:#6ee7b7; --ok-bg:#064e3b; --ok-line:#065f46;
    --shadow:rgba(0,0,0,.35);

  }
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    fill: var(--ink);
  }
  /* 字号是按「图在正文列里显示后的实际大小」定的：
     正文列约 740px，图的设计宽度是 960 → 缩放约 0.77。
     所以这里的 15px 在页面上大约是 11.6px，不能再小了。 */
  .t-title  { font-size:22px; font-weight:700; }
  .t-sub    { font-size:15.5px; fill:var(--muted); }
  .t-h      { font-size:17px; font-weight:650; }
  .t-body   { font-size:15px; }
  .t-small  { font-size:13px; fill:var(--muted); }
  .t-mono   { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; font-size:13.5px; }
  .t-badge  { font-size:12.5px; font-weight:700; letter-spacing:.4px; }
  .panel    { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
  .panel-a  { fill:var(--accent-bg); stroke:var(--accent-line); stroke-width:1.2; }
  .panel-d  { fill:var(--danger-bg); stroke:var(--danger-line); stroke-width:1.2; }
  .panel-w  { fill:var(--warn-bg);   stroke:var(--warn-line);   stroke-width:1.2; }
  .panel-o  { fill:var(--ok-bg);     stroke:var(--ok-line);     stroke-width:1.2; }
  .edge     { stroke:var(--line); stroke-width:1.6; fill:none; }
  .edge-a   { stroke:var(--accent); stroke-width:2; fill:none; }
  .edge-d   { stroke:var(--danger); stroke-width:2; fill:none; }
  .edge-w   { stroke:var(--warn);   stroke-width:2; fill:none; }
  .ink-a    { fill:var(--accent); }
  .ink-d    { fill:var(--danger); }
  .ink-w    { fill:var(--warn); }
  .ink-o    { fill:var(--ok); }
  .ink-m    { fill:var(--muted); }

  /* —— 动画 —— */
  @keyframes dash  { to { stroke-dashoffset:-40; } }
  @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @keyframes rise  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes sweep { from { transform:translateX(-40px); } to { transform:translateX(40px); } }

  .flow    { stroke-dasharray:7 13; animation:dash 1.6s linear infinite; }
  .pulse   { animation:pulse 2.2s ease-in-out infinite; }
  .rise    { animation:rise .5s ease-out both; }
  .rise-2  { animation:rise .5s .12s ease-out both; }
  .rise-3  { animation:rise .5s .24s ease-out both; }
  .rise-4  { animation:rise .5s .36s ease-out both; }
  .sweep   { animation:sweep 2.6s ease-in-out infinite alternate; }

  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.rise,.rise-2,.rise-3,.rise-4,.sweep { animation:none; }
  }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)"/>
    </filter>
  </defs>
  <rect width="960" height="500" fill="var(--panel)"/>
  <rect width="960" height="500" fill="none"/>
  <text x="480.0" y="34" class="t-title" text-anchor="middle">三层防线：越往外越可靠</text>
  <rect x="30" y="60" width="620" height="400" rx="14" class="panel-d" opacity="0.55"/>
  <text x="48" y="88" class="t-h">第 3 层 · 外层隔离（容器 / VM）</text>
  <text x="48" y="108" class="t-small">唯一真正的安全边界</text>
  <rect x="586" y="72" width="52" height="22" rx="6" fill="none" stroke="none"/>
  <text x="632" y="88" class="t-badge" text-anchor="end">最外</text>
  <rect x="80" y="110" width="520" height="300" rx="14" class="panel-w" opacity="0.55"/>
  <text x="98" y="138" class="t-h">第 2 层 · 沙箱 sandbox</text>
  <text x="98" y="158" class="t-small">操作系统强制，限制可达文件与主机</text>
  <rect x="536" y="122" width="52" height="22" rx="6" fill="none" stroke="none"/>
  <text x="582" y="138" class="t-badge" text-anchor="end">中间</text>
  <rect x="130" y="160" width="420" height="200" rx="14" class="panel-a" opacity="0.55"/>
  <text x="148" y="188" class="t-h">第 1 层 · 权限规则 + 权限模式</text>
  <text x="148" y="208" class="t-small">决定「要不要问」和「能不能」</text>
  <rect x="486" y="172" width="52" height="22" rx="6" fill="none" stroke="none"/>
  <text x="532" y="188" class="t-badge" text-anchor="end">最内</text>
  <rect x="190" y="215" width="300" height="120" rx="12" class="panel" filter="url(#sh)"/>
  <text x="340" y="247" class="t-h" text-anchor="middle">模型想做什么</text>
  <text x="340" y="271" class="t-small" text-anchor="middle">CLAUDE.md / skill / 提示词</text>
  <text x="340" y="299" class="t-body ink-w" text-anchor="middle">只是建议 —— 模型可以不遵守</text>
  <rect x="700" y="120" width="220" height="90" rx="12" class="panel-d" filter="url(#sh)"/>
  <text x="810" y="152" class="t-mono" text-anchor="middle">Bash(curl …)</text>
  <text x="810" y="178" class="t-small" text-anchor="middle">命令真的执行了</text>
  <rect x="770" y="108" width="100" height="20" rx="10" fill="var(--danger-bg)" stroke="none"/>  <text x="820.0" y="122" class="t-badge" text-anchor="middle" fill="var(--danger)">第 2 层拦住</text>
  <path d="M810,214 L810,250" class="edge-d" marker-end="url(#ah)"/>
  <rect x="700" y="254" width="220" height="90" rx="12" class="panel-o" filter="url(#sh)"/>
  <text x="810" y="286" class="t-h ink-o" text-anchor="middle">被沙箱边界挡住</text>
  <text x="810" y="312" class="t-small" text-anchor="middle">网络只走本机代理</text>
  <rect x="700" y="380" width="220" height="74" rx="12" class="panel"/>
  <text x="810" y="410" class="t-h" text-anchor="middle">本仓库现状</text>
  <text x="810" y="432" class="t-small ink-d" text-anchor="middle">原生 Windows → 无沙箱</text>
  <text x="480.0" y="480" class="t-small" text-anchor="middle">官方原话：Permission rules are enforced by Claude Code, not by the model.</text>
</svg>
