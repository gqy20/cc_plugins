<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400"
     width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">同一规则两种写法的强度对比</title>
  <desc id="d">左侧把规则写在 CLAUDE.md 里，模型只是「通常会遵守」；右侧写进 permissions.deny，Claude Code 在工具调用前直接拦截。</desc>
  <style>
  :root {

    --ink:#e2e8f0; --muted:#94a3b8; --line:#475569;
    --panel:#1e293b; --panel2:#172033;
    --accent:#a5b4fc; --accent-bg:#312e81; --accent-line:#4f46e5;
    --danger:#fca5a5; --danger-bg:#4c1d1d; --danger-line:#7f1d1d;
    --warn:#fcd34d; --warn-bg:#451a03; --warn-line:#78350f;
    --ok:#6ee7b7; --ok-bg:#064e3b; --ok-line:#065f46;
    --shadow:rgba(0,0,0,.35);

  }
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    fill: var(--ink);
  }
  /* 字号是按「图在正文列里显示后的实际大小」定的：
     正文列约 740px，图的设计宽度是 960 → 缩放约 0.77。
     所以这里的 15px 在页面上大约是 11.6px，不能再小了。 */
  .t-title  { font-size:22px; font-weight:700; }
  .t-sub    { font-size:15.5px; fill:var(--muted); }
  .t-h      { font-size:17px; font-weight:650; }
  .t-body   { font-size:15px; }
  .t-small  { font-size:13px; fill:var(--muted); }
  .t-mono   { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; font-size:13.5px; }
  .t-badge  { font-size:12.5px; font-weight:700; letter-spacing:.4px; }
  .panel    { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
  .panel-a  { fill:var(--accent-bg); stroke:var(--accent-line); stroke-width:1.2; }
  .panel-d  { fill:var(--danger-bg); stroke:var(--danger-line); stroke-width:1.2; }
  .panel-w  { fill:var(--warn-bg);   stroke:var(--warn-line);   stroke-width:1.2; }
  .panel-o  { fill:var(--ok-bg);     stroke:var(--ok-line);     stroke-width:1.2; }
  .edge     { stroke:var(--line); stroke-width:1.6; fill:none; }
  .edge-a   { stroke:var(--accent); stroke-width:2; fill:none; }
  .edge-d   { stroke:var(--danger); stroke-width:2; fill:none; }
  .edge-w   { stroke:var(--warn);   stroke-width:2; fill:none; }
  .ink-a    { fill:var(--accent); }
  .ink-d    { fill:var(--danger); }
  .ink-w    { fill:var(--warn); }
  .ink-o    { fill:var(--ok); }
  .ink-m    { fill:var(--muted); }

  /* —— 动画 —— */
  @keyframes dash  { to { stroke-dashoffset:-40; } }
  @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @keyframes rise  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes sweep { from { transform:translateX(-40px); } to { transform:translateX(40px); } }

  .flow    { stroke-dasharray:7 13; animation:dash 1.6s linear infinite; }
  .pulse   { animation:pulse 2.2s ease-in-out infinite; }
  .rise    { animation:rise .5s ease-out both; }
  .rise-2  { animation:rise .5s .12s ease-out both; }
  .rise-3  { animation:rise .5s .24s ease-out both; }
  .rise-4  { animation:rise .5s .36s ease-out both; }
  .sweep   { animation:sweep 2.6s ease-in-out infinite alternate; }

  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.rise,.rise-2,.rise-3,.rise-4,.sweep { animation:none; }
  }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)"/>
    </filter>
  </defs>
  <rect width="960" height="400" fill="var(--panel)"/>
  <rect width="960" height="400" fill="none"/>
  <rect x="40" y="60" width="400" height="280" rx="14" class="panel" filter="url(#sh)"/>
  <rect x="52" y="52" width="104.80000000000001" height="20" rx="10" fill="var(--warn-bg)" stroke="none"/>  <text x="104.4" y="66" class="t-badge" text-anchor="middle" fill="var(--warn)">非确定性 · 靠模型自觉</text>
  <text x="60" y="100" class="t-h">写在 CLAUDE.md 里</text>
  <text x="60" y="124" class="t-mono" fill="var(--muted)">「永远不要提交 secrets」</text>
  <path d="M240,140 L240,178" class="edge-w" marker-end="url(#ah)"/>
  <rect x="60" y="182" width="360" height="48" rx="10" class="panel-w"/>
  <text x="78" y="212" class="t-body">模型读到这段指令</text>
  <path d="M240,234 L240,268" class="edge-w" marker-end="url(#ah)"/>
  <rect x="60" y="272" width="360" height="48" rx="10" class="panel-w" stroke-dasharray="6 4"/>
  <text x="78" y="302" class="t-body ink-w">「通常会遵守」—— 但没有保证</text>
  <rect x="520" y="60" width="400" height="280" rx="14" class="panel" filter="url(#sh)"/>
  <rect x="532" y="52" width="164.0" height="20" rx="10" fill="var(--danger-bg)" stroke="none"/>  <text x="614.0" y="66" class="t-badge" text-anchor="middle" fill="var(--danger)">确定性 · Claude Code 执行</text>
  <text x="540" y="100" class="t-h">写在 permissions.deny 里</text>
  <text x="540" y="124" class="t-mono" fill="var(--muted)">"deny": ["Read(*/secrets/*)"]</text>
  <path d="M740,140 L740,178" class="edge-d" marker-end="url(#ah)"/>
  <rect x="540" y="182" width="360" height="48" rx="10" class="panel-d"/>
  <text x="558" y="212" class="t-body">Claude Code 在工具调用前拦截</text>
  <path d="M740,234 L740,268" class="edge-d" marker-end="url(#ah)"/>
  <rect x="540" y="272" width="360" height="48" rx="10" class="panel-d"/>
  <text x="558" y="302" class="t-body ink-d">「拒绝执行」—— 所有模式都拦得住</text>
  <rect x="456" y="160" width="48" height="48" rx="24" class="panel" stroke-width="1.4"/>
  <text x="480" y="191" class="t-badge ink-m" text-anchor="middle">VS</text>
  <text x="480.0" y="32" class="t-title" text-anchor="middle">同一条规则，两种写法，保护强度差一个数量级</text>
  <text x="480.0" y="372" class="t-small" text-anchor="middle">官方 best-practices：指令机制分「确定性」（权限规则 / hooks / 沙箱）与「非确定性」（CLAUDE.md / skill / prompt 型 hook）</text>
</svg>
