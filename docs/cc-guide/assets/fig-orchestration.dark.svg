<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470"
     width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">四种并行编排方式对比</title>
  <desc id="d">四栏对比 Subagents、Agent Teams、Workflows、跨会话消息，分别标注谁决定下一步、中间结果放在哪里、规模上限。</desc>
  <style>
  :root {

    --ink:#e2e8f0; --muted:#94a3b8; --line:#475569;
    --panel:#1e293b; --panel2:#172033;
    --accent:#a5b4fc; --accent-bg:#312e81; --accent-line:#4f46e5;
    --danger:#fca5a5; --danger-bg:#4c1d1d; --danger-line:#7f1d1d;
    --warn:#fcd34d; --warn-bg:#451a03; --warn-line:#78350f;
    --ok:#6ee7b7; --ok-bg:#064e3b; --ok-line:#065f46;
    --shadow:rgba(0,0,0,.35);

  }
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    fill: var(--ink);
  }
  /* 字号是按「图在正文列里显示后的实际大小」定的：
     正文列约 740px，图的设计宽度是 960 → 缩放约 0.77。
     所以这里的 15px 在页面上大约是 11.6px，不能再小了。 */
  .t-title  { font-size:22px; font-weight:700; }
  .t-sub    { font-size:15.5px; fill:var(--muted); }
  .t-h      { font-size:17px; font-weight:650; }
  .t-body   { font-size:15px; }
  .t-small  { font-size:13px; fill:var(--muted); }
  .t-mono   { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; font-size:13.5px; }
  .t-badge  { font-size:12.5px; font-weight:700; letter-spacing:.4px; }
  .panel    { fill:var(--panel); stroke:var(--line); stroke-width:1.2; }
  .panel-a  { fill:var(--accent-bg); stroke:var(--accent-line); stroke-width:1.2; }
  .panel-d  { fill:var(--danger-bg); stroke:var(--danger-line); stroke-width:1.2; }
  .panel-w  { fill:var(--warn-bg);   stroke:var(--warn-line);   stroke-width:1.2; }
  .panel-o  { fill:var(--ok-bg);     stroke:var(--ok-line);     stroke-width:1.2; }
  .edge     { stroke:var(--line); stroke-width:1.6; fill:none; }
  .edge-a   { stroke:var(--accent); stroke-width:2; fill:none; }
  .edge-d   { stroke:var(--danger); stroke-width:2; fill:none; }
  .edge-w   { stroke:var(--warn);   stroke-width:2; fill:none; }
  .ink-a    { fill:var(--accent); }
  .ink-d    { fill:var(--danger); }
  .ink-w    { fill:var(--warn); }
  .ink-o    { fill:var(--ok); }
  .ink-m    { fill:var(--muted); }

  /* —— 动画 —— */
  @keyframes dash  { to { stroke-dashoffset:-40; } }
  @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @keyframes rise  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes sweep { from { transform:translateX(-40px); } to { transform:translateX(40px); } }

  .flow    { stroke-dasharray:7 13; animation:dash 1.6s linear infinite; }
  .pulse   { animation:pulse 2.2s ease-in-out infinite; }
  .rise    { animation:rise .5s ease-out both; }
  .rise-2  { animation:rise .5s .12s ease-out both; }
  .rise-3  { animation:rise .5s .24s ease-out both; }
  .rise-4  { animation:rise .5s .36s ease-out both; }
  .sweep   { animation:sweep 2.6s ease-in-out infinite alternate; }

  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.rise,.rise-2,.rise-3,.rise-4,.sweep { animation:none; }
  }
</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--danger)"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)"/>
    </filter>
  </defs>
  <rect width="960" height="470" fill="var(--panel)"/>
  <rect width="960" height="470" fill="none"/>
  <text x="480.0" y="34" class="t-title" text-anchor="middle">四种「并行」：计划在谁手里？</text>
  <rect x="30" y="70" width="214" height="350" rx="14" class="panel-a" opacity="0.4"/>
  <rect x="30" y="70" width="214" height="46" rx="14" class="panel-a"/>
  <text x="137.0" y="100" class="t-h" text-anchor="middle">Subagents</text>
  <text x="46" y="142" class="t-small">谁决定下一步</text>
  <text x="46" y="162" class="t-body">Claude 逐轮决定</text>
  <text x="46" y="190" class="t-small">中间结果在哪</text>
  <text x="46" y="210" class="t-body">结果回到 Claude 的上下文</text>
  <text x="46" y="238" class="t-small">规模</text>
  <text x="46" y="258" class="t-body">每轮几个</text>
  <rect x="46" y="290" width="182" height="32" rx="8" class="panel"/>
  <text x="137.0" y="311" class="t-small" text-anchor="middle">主会话</text>
  <path d="M137.0,322 L137.0,330" class="edge-a flow"/>
  <rect x="46" y="330" width="182" height="32" rx="8" class="panel"/>
  <text x="137.0" y="351" class="t-small" text-anchor="middle">决定下一步</text>
  <path d="M137.0,362 L137.0,370" class="edge-a flow"/>
  <rect x="46" y="370" width="182" height="32" rx="8" class="panel"/>
  <text x="137.0" y="391" class="t-small" text-anchor="middle">返回摘要</text>
  <rect x="266" y="70" width="214" height="350" rx="14" class="panel-w" opacity="0.4"/>
  <rect x="266" y="70" width="214" height="46" rx="14" class="panel-w"/>
  <text x="373.0" y="100" class="t-h" text-anchor="middle">Agent Teams</text>
  <text x="282" y="142" class="t-small">谁决定下一步</text>
  <text x="282" y="162" class="t-body">lead agent 逐轮决定</text>
  <text x="282" y="190" class="t-small">中间结果在哪</text>
  <text x="282" y="210" class="t-body">共享任务列表</text>
  <text x="282" y="238" class="t-small">规模</text>
  <text x="282" y="258" class="t-body">几个长跑同伴</text>
  <rect x="282" y="290" width="182" height="32" rx="8" class="panel"/>
  <text x="373.0" y="311" class="t-small" text-anchor="middle">lead</text>
  <path d="M373.0,322 L373.0,330" class="edge-a flow"/>
  <rect x="282" y="330" width="182" height="32" rx="8" class="panel"/>
  <text x="373.0" y="351" class="t-small" text-anchor="middle">mate</text>
  <path d="M373.0,362 L373.0,370" class="edge-a flow"/>
  <rect x="282" y="370" width="182" height="32" rx="8" class="panel"/>
  <text x="373.0" y="391" class="t-small" text-anchor="middle">mate</text>
  <rect x="502" y="70" width="214" height="350" rx="14" class="panel-o" opacity="0.4"/>
  <rect x="502" y="70" width="214" height="46" rx="14" class="panel-o"/>
  <text x="609.0" y="100" class="t-h" text-anchor="middle">Workflows</text>
  <text x="518" y="142" class="t-small">谁决定下一步</text>
  <text x="518" y="162" class="t-body">脚本决定</text>
  <text x="518" y="190" class="t-small">中间结果在哪</text>
  <text x="518" y="210" class="t-body">脚本变量</text>
  <text x="518" y="238" class="t-small">规模</text>
  <text x="518" y="258" class="t-body">几十到几百个</text>
  <rect x="518" y="290" width="182" height="32" rx="8" class="panel"/>
  <text x="609.0" y="311" class="t-small" text-anchor="middle">workflow.js</text>
  <path d="M609.0,322 L609.0,330" class="edge-a flow"/>
  <rect x="518" y="330" width="182" height="32" rx="8" class="panel"/>
  <text x="609.0" y="351" class="t-small" text-anchor="middle">agent × N</text>
  <path d="M609.0,362 L609.0,370" class="edge-a flow"/>
  <rect x="518" y="370" width="182" height="32" rx="8" class="panel"/>
  <text x="609.0" y="391" class="t-small" text-anchor="middle">最终答案</text>
  <rect x="738" y="70" width="214" height="350" rx="14" class="panel-a" opacity="0.4"/>
  <rect x="738" y="70" width="214" height="46" rx="14" class="panel-a"/>
  <text x="845.0" y="100" class="t-h" text-anchor="middle">跨会话消息</text>
  <text x="754" y="142" class="t-small">谁决定下一步</text>
  <text x="754" y="162" class="t-body">你 + 多个会话</text>
  <text x="754" y="190" class="t-small">中间结果在哪</text>
  <text x="754" y="210" class="t-body">对方的上下文</text>
  <text x="754" y="238" class="t-small">规模</text>
  <text x="754" y="258" class="t-body">同机 / 跨机器</text>
  <rect x="754" y="290" width="182" height="32" rx="8" class="panel"/>
  <text x="845.0" y="311" class="t-small" text-anchor="middle">会话 A</text>
  <path d="M845.0,322 L845.0,330" class="edge-a flow"/>
  <rect x="754" y="330" width="182" height="32" rx="8" class="panel"/>
  <text x="845.0" y="351" class="t-small" text-anchor="middle">消息</text>
  <path d="M845.0,362 L845.0,370" class="edge-a flow"/>
  <rect x="754" y="370" width="182" height="32" rx="8" class="panel"/>
  <text x="845.0" y="391" class="t-small" text-anchor="middle">会话 B</text>
  <rect x="30" y="434" width="900" height="1.2" rx="0" class="panel" fill="var(--line)" stroke="none"/>
  <text x="480.0" y="456" class="t-small" text-anchor="middle">一句话：需要结果 → Subagent；需要讨论 → Agent Teams；需要可重跑、可审计 → Workflows；需要跨终端交接 → 跨会话消息。</text>
</svg>
